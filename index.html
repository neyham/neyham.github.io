<script>
(function () {
  var works = {
    moshvr: {
      mv: 'Bauhaus', title: 'moshVR', after: 'After Dessau, 1923',
      img: 'media/moshvr-banner.svg', wide: true, bg: '#080e0a',
      desc: 'A native mosh and SSH terminal for Meta Quest. No PC streaming. Confirm text to the host. Source is public; available on SideQuest.',
      medium: 'Mosh · SSH · passthrough · voice input',
      links: [['SideQuest', 'https://sidequestvr.com/app/62512'], ['GitHub', 'https://github.com/neyham/moshvr']]
    },
    dashboard: {
      mv: 'De Stijl', title: 'AI Usage Dashboard', after: 'After Mondrian, 1930',
      img: 'media/dashboard.jpg', wide: true, bg: '#131313',
      desc: 'A local desktop cockpit for Claude, Codex, Grok, Cursor and Antigravity usage windows, plus DeepSeek API balance. No dashboard account. No telemetry.',
      medium: 'Desktop · local only',
      links: [['GitHub', 'https://github.com/neyham/ai-usage-dashboard']]
    },
    speaker: {
      mv: 'Art Deco', title: 'ha-agent-speaker', after: 'Radio cabinet, c. 1932',
      img: 'media/ha-agent-speaker.jpg',
      desc: 'Turn a Linux box into a wake-word voice agent. Local listen, Whisper, an LLM with tools, optional Home Assistant, then Piper out of the speakers.',
      medium: 'Wake word · Whisper · tool-using LLM · Piper',
      links: [['GitHub', 'https://github.com/neyham/ha-agent-speaker']]
    },
    caschill: {
      mv: 'Blue Note', title: 'CAS Chill', after: 'After Reid Miles, 1958',
      img: 'media/cas-chill.jpg',
      desc: 'Chinese Accounting Standards as Chill Jazz study albums.',
      medium: 'Album series · chill jazz',
      links: [['NetEase Music', 'https://music.163.com/artist?id=126775377'], ['bilibili', 'https://space.bilibili.com/35899585']]
    },
    paddock: {
      mv: 'Pop Art', title: 'herdr-paddock', after: 'After Lichtenstein, 1963',
      img: 'media/paddock.gif', wide: true, bg: '#11141b',
      desc: 'A card-wall feed for your herdr flock. Blocked agents bleat to the top. Each card is the agent’s output, cleaned. Plain SSH. No relay, no web server.',
      medium: 'Terminal UI · SSH · multi-agent',
      links: [['GitHub', 'https://github.com/neyham/herdr-paddock']]
    }
  };

  var dlg = document.getElementById('sheet');
  var $ = function (id) { return document.getElementById(id); };

  document.querySelectorAll('button.plate').forEach(function (b) {
    b.addEventListener('click', function () {
      var w = works[b.dataset.id];
      if (!w) return;
      $('sheet-mv').textContent = w.mv;
      $('sheet-title').textContent = w.title;
      $('sheet-after').textContent = w.after;
      $('sheet-desc').textContent = w.desc;
      $('sheet-medium').textContent = w.medium;
      $('sheet-img').src = w.img;
      $('sheet-img').alt = w.title;
      $('sheet-fig').style.background = w.bg || '';
      dlg.querySelector('.sheet').classList.toggle('wide', !!w.wide);
      $('sheet-links').innerHTML = '';
      w.links.forEach(function (l) {
        var a = document.createElement('a');
        a.href = l[1];
        a.textContent = l[0] + ' ↗';
        $('sheet-links').appendChild(a);
      });
      if (dlg.showModal) dlg.showModal(); else location.href = w.links[0][1];
    });
  });
  dlg.querySelector('.close').addEventListener('click', function () { dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });

  // Hang the plates one by one
  var pieces = document.querySelectorAll('.piece');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches || !('IntersectionObserver' in window)) {
    pieces.forEach(function (p) { p.classList.add('in'); });
    return;
  }
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var i = Array.prototype.indexOf.call(pieces, e.target) % 3;
      setTimeout(function () { e.target.classList.add('in'); }, i * 120);
      io.unobserve(e.target);
    });
  }, { rootMargin: '0px 0px -6% 0px' });
  pieces.forEach(function (p) { io.observe(p); });
})();
</script>
