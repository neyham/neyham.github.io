<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">moshVR — Native terminal. Spatial workspace.</title>
<desc id="desc">Original moshVR branding: a green terminal prompt surrounded by nested spatial planes. This is an illustration, not a product screenshot.</desc>
<defs>
 <radialGradient id="glow"><stop stop-color="#2bff7d" stop-opacity=".2"/><stop offset="1" stop-color="#2bff7d" stop-opacity="0"/></radialGradient>
 <linearGradient id="line" x2="1" y2="1"><stop stop-color="#75ff9d"/><stop offset="1" stop-color="#284d34"/></linearGradient>
 <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#16281b"/><stop offset="1" stop-color="#0d150f"/></linearGradient>
 <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".8" fill="#8bc39d" opacity=".12"/></pattern>
</defs>
<rect width="1280" height="480" rx="20" fill="#080e0a"/>
<rect width="1280" height="480" rx="20" fill="url(#dots)"/>
<ellipse cx="1010" cy="228" rx="320" ry="290" fill="url(#glow)"/>
<path d="M58 62H86" stroke="#88ffac" stroke-width="3"/>
<text x="100" y="67" fill="#8ba692" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="3">INDEPENDENT SOFTWARE / META QUEST</text>
<text x="54" y="247" fill="#edf4ea" font-family="Arial,Helvetica,sans-serif" font-size="136" font-weight="700" letter-spacing="-8">mosh<tspan fill="#8affac">VR</tspan></text>
<text x="61" y="303" fill="#e0eadd" font-family="Arial,Helvetica,sans-serif" font-size="28" letter-spacing="-.4">Native terminal. Spatial workspace.</text>
<path d="M61 357H581" stroke="#304333"/>
<g font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2" fill="#91aa98">
 <text x="61" y="393">MOSH + SSH</text><text x="233" y="393">PASSTHROUGH</text><text x="451" y="393">VOICE INPUT</text>
</g>
<g transform="translate(788 86)">
 <path d="M72 28L374 72L331 348L29 304Z" fill="none" stroke="#263e2d" stroke-width="1.5"/>
 <path d="M43 14L345 58L302 334L0 290Z" fill="none" stroke="#385d42" stroke-width="1.5"/>
 <path d="M14 0L316 44L273 320L-29 276Z" fill="url(#panel)" stroke="url(#line)" stroke-width="2"/>
 <g transform="translate(38 56) rotate(8)">
  <path d="M30 41L94 98L30 155M136 155H200" stroke="#8affac" stroke-width="18" stroke-linecap="square" stroke-linejoin="miter" fill="none"/>
  <path d="M16 218H89M104 218H137" stroke="#50765b" stroke-width="3"/>
 </g>
 <circle cx="292" cy="72" r="4" fill="#8affac"/>
</g>
<path d="M704 70V411" stroke="#304333" stroke-dasharray="2 9" opacity=".65"/>
<text x="1220" y="438" text-anchor="end" fill="#6c8c76" font-family="Arial,Helvetica,sans-serif" font-size="11" letter-spacing="3">A SHELL WITH A SENSE OF SPACE</text>
</svg>
